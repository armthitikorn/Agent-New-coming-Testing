            { q: "33. โรคใดที่มีผลต่อระบบหายใจและมักถูกพิจารณาอย่างเข้มงวด?", a: "A", choices: ["โรคถุงลมโป่งพอง", "โรคหอบหืด", "โรคหวัด", "โรคภูมิแพ้"] },
            { q: "34. หากผู้สมัครมีประวัติโรคซึมเศร้าเรื้อรัง บริษัทประกันจะพิจารณาอย่างไร?", a: "A", choices: ["ปฏิเสธการรับประกัน", "เพิ่มเบี้ยประกัน", "รับประกันโดยไม่มีเงื่อนไข", "ให้ความคุ้มครองเฉพาะจิตเวช"] },
            { q: "35. โรคใดที่มีผลต่อการทำงานของต่อมไทรอยด์และต้องควบคุมด้วยยา?", a: "A", choices: ["ไทรอยด์เป็นพิษ", "โรคเบาหวาน", "โรคตับอักเสบ", "โรคข้ออักเสบ"] },
            { q: "36. หากผู้สมัครมีประวัติโรคมะเร็งที่รักษาหายแล้ว บริษัทประกันจะพิจารณาอย่างไร?", a: "A", choices: ["รับประกันโดยมีเงื่อนไข", "ปฏิเสธการรับประกันทันที", "เพิ่มเบี้ยประกัน", "ให้ความคุ้มครองเฉพาะโรคมะเร็ง"] },
            { q: "37. โรคใดที่มีผลต่อระบบสืบพันธุ์และมักถูกปฏิเสธการประกัน?", a: "A", choices: ["ซิฟิลิส", "โรคหอบหืด", "โรคไข้เลือดออก", "โรคตาแดง"] },
            { q: "38. หากผู้มุ่งหวัง มีภาวะอัมพาตจากอุบัติเหตุในอดีต บริษัทประกันจะพิจารณาอย่างไร?", a: "A", choices: ["ปฏิเสธการรับประกัน", "เพิ่มเบี้ยประกัน", "รับประกันโดยไม่มีเงื่อนไข", "ให้ความคุ้มครองเฉพาะอุบัติเหตุ"] },
            { q: "39. เมื่อได้รับใบอนุญาตตัวแทนประกันชีวิตครั้งแรกมีอายุกี่ปี?", a: "A", choices: ["1 ปี", "2 ปี", "3 ปี", "ตลอดชีพ"] },
            { q: "40. หากโทรศัพท์นัดหมายผู้มุ่งหวัง บอกว่าไม่มีเวลาให้ท่านเข้าพบ ท่านควรทำอย่างไร", a: "C", choices: ["พูดต่อทันที", "ตื๊อให้จบ", "ขอนัดเวลาใหม่", "วางสายไปเลย"] },
            { q: "41. การเสนอประกันแบบเร่งรีบมีผลอย่างไร", a: "D", choices: ["ลูกค้าซื้อทันที", "เข้าใจง่าย", "รู้สึกประทับใจ", "อาจทำให้ลูกค้าไม่เชื่อมั่น"] },
            { q: "42. ท่านควรใช้ถ้อยคำอย่างไร เมื่ออธิบายแนวคิดการทำประกัน", a: "B", choices: ["ศัพท์เทคนิคมาก ๆ", "ภาษาง่าย ๆ เข้าใจง่าย", "ใช้คำยาว ๆ", "แค่บอกชื่อแผน"] },
            { q: "43. ประโยชน์ของเบี้ยประกันที่ผู้เอาประกันจ่ายคืออะไร", a: "A", choices: ["เป็นค่าคุ้มครองและสะสมทรัพย์", "เป็นค่าปรับ", "ไม่มีประโยชน์", "จ่ายให้ตัวแทน"] },
            { q: "44. การจดบันทึกระหว่างสนทนาเพื่อค้นหาข้อมูลช่วยได้อย่างไร", a: "C", choices: ["ไม่จำเป็น", "เสียเวลา", "หาความต้องการของลูกค้าได้ดีขึ้น", "ทำให้ลืม"] },
            { q: "45. แนวทางตอบข้อโต้แย้งของลูกค้าคืออะไร", a: "D", choices: ["หลีกเลี่ยงการตอบ", "พูดให้จบไว", "พูดวกไปวนมา", "ฟังและตอบด้วยเหตุผลที่ตรงประเด็น"] },
            { q: "46. เมื่อลูกค้าถามเรื่องภาษี ควรตอบอย่างไร", a: "B", choices: ["ไม่ต้องรู้หรอก", "สามารถลดหย่อนภาษีได้ตามเงื่อนไขของกรมสรรพากร", "ไม่เกี่ยวกับกรมธรรม์", "ขึ้นกับดวง"] },
            { q: "47.การโทรศัพท์นัดหมายเข้าพบ ควรจดบันทึกการพูดคุยกับผู้มุ่งหวังด้วยนั้น มีประโยชน์อย่างไร", a: "C", choices: ["เพื่อลืมง่าย", "เพื่อโทรซ้ำโดยไม่รู้ตัว", "เพื่อได้ข้อมูลและการติดตามภายหลัง", "เพื่อให้ข้อมูลซ้ำ ๆ"] },
            { q: "48. การตั้งเป้าหมายในการขายมีความสำคัญอย่างไร", a: "A", choices: ["ช่วยวางแผนการทำงาน", "ไม่มีผล", "ทำให้เครียด", "ไม่จำเป็น"] },
            { q: "49. การใช้คำถามเปิดในการพูดคุยช่วยอย่างไร", a: "B", choices: ["ทำให้ลูกค้ารู้สึกกดดัน", "ทำให้รู้ความต้องการลูกค้า", "เสียเวลา", "ทำให้ลูกค้าโกรธ"] },
            { q: "50. การใช้ภาษาที่เข้าใจง่ายสำคัญอย่างไร", a: "A", choices: ["ทำให้ลูกค้าเข้าใจง่ายขึ้น", "ทำให้ลูกค้าสับสน", "ไม่มีความหมาย", "ทำให้ดูไม่เป็นมืออาชีพ"] }
        ];

        const quizForm = document.getElementById('quizForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const resultDiv = document.getElementById('result');
        const actionContainer = document.getElementById('actionContainer');
        const nameInput = document.getElementById('name');
        const quizHeader = document.getElementById('quizHeader').textContent;

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const storedName = urlParams.get('name') || sessionStorage.getItem('user_name');
            if (storedName) {
                nameInput.value = storedName;
            }

            // 🔑 สร้าง/รับรหัสรอบการทำข้อสอบ (session_id) — 1 ครั้งต่อการเข้าทำ 1 รอบ
            currentSessionId = urlParams.get('session') || sessionStorage.getItem('current_test_session') || crypto.randomUUID();
            sessionStorage.setItem('current_test_session', currentSessionId);
        });

        function renderQuiz() {
            loading.classList.add('hidden');
            quizForm.classList.remove('hidden');
            submitBtn.classList.remove('hidden');

            questions.forEach((q, index) => {
                const container = document.createElement('div');
                container.className = 'question-container';

                const questionTitle = document.createElement('h3');
                questionTitle.textContent = q.q;
                container.appendChild(questionTitle);

                const ul = document.createElement('ul');
                ul.className = 'choices';

                q.choices.forEach((choice, i) => {
                    const li = document.createElement('li');
                    const label = document.createElement('label');
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = String.fromCharCode(65 + i);
                    label.appendChild(input);
                    label.appendChild(document.createTextNode(` ${input.value}. ${choice}`));
                    li.appendChild(label);
                    ul.appendChild(li);
                });

                container.appendChild(ul);
                quizForm.appendChild(container);
            });
        }
        
        async function initialize() {
            try {
                const { data: { user }, error } = await supabase.auth.getUser();
                if (user) currentUser = user;
            } catch (e) {
                console.warn("Could not retrieve current user.", e);
            }
            renderQuiz();
        }

        initialize();

        submitBtn.addEventListener('click', async () => {
            const userNameVal = nameInput.value.trim();
            if (!userNameVal) {
                alert("กรุณากรอกชื่อผู้ทำแบบทดสอบก่อนส่งคำตอบครับ");
                nameInput.focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังส่งคำตอบ...';

            let score = 0;
            const answers = [];

            questions.forEach((q, index) => {
                const selected = document.querySelector(`input[name="question-${index}"]:checked`);
                const answer = selected ? selected.value : null; 
                answers.push(answer);
                if (answer === q.a) score++;
            });

            const totalQuestions = questions.length;
            const percentage = Math.round((score / totalQuestions) * 100);
            
            const urlParams = new URLSearchParams(window.location.search);
            const userEmail = urlParams.get('email') || sessionStorage.getItem('user_email') || currentUser?.email || "anonymous@example.com";
            const userExperience = urlParams.get('experience') || sessionStorage.getItem('user_experience') || "ไม่ระบุ";

            // --- กำหนดระดับความรู้ตามช่วงคะแนน ---
            let levelName = "";
            let boxBgColor = "";
            let boxTextColor = "";

            if (score <= 28) {
                levelName = "เริ่มต้น";
                boxBgColor = '#fff3cd'; 
                boxTextColor = '#856404';
            } else if (score >= 29 && score <= 39) {
                levelName = "มาตรฐาน";
                boxBgColor = '#d1ecf1'; 
                boxTextColor = '#0c5460';
            } else {
                levelName = "ผู้เชี่ยวชาญ";
                boxBgColor = '#d1ffd1'; 
                boxTextColor = '#005900';
            }

            try {
                // บันทึกข้อมูลรวมถึงฟิลด์ level และ session_id ลงใน Supabase
                const { error } = await supabase
                    .from('quiz_results_agent')
                    .insert([{
                        user_email: userEmail,
                        name: userNameVal,
                        score: score,
                        total_questions: totalQuestions,
                        answers: answers,
                        experience: userExperience,
                        quiz_set: quizHeader,
                        level: levelName,
                        session_id: currentSessionId
                    }]);

                if (error) throw error; 

                // แสดงผลลัพธ์และระดับความรู้หน้าจอผู้สอบ
                resultDiv.innerHTML = `📊 ผลการประเมินของคุณ: ระดับ <strong>${levelName}</strong><br>ได้คะแนน ${score} จาก ${totalQuestions} ข้อ (${percentage}%)`;
                resultDiv.style.backgroundColor = boxBgColor;
                resultDiv.style.color = boxTextColor;
                resultDiv.style.display = 'block';

                quizForm.style.display = 'none';
                submitBtn.style.display = 'none';

                // 📌 ปุ่มพาไปทำข้อสอบอัตนัย (Index 13) พร้อมส่ง session_id ต่อ
                const nextBtn = document.createElement('button');
                nextBtn.textContent = '✍️ ไปทำข้อสอบอัตนัย (ชุดถัดไป)';
                nextBtn.style.backgroundColor = '#8b5cf6'; // ใช้สีม่วงเพื่อให้แตกต่าง
                nextBtn.onclick = () => {
                    // ส่งชื่อ อีเมล และ session_id ติดตัวไปกับ URL ของหน้าข้อสอบอัตนัย
                    const targetUrl = `index13.html?name=${encodeURIComponent(userNameVal)}&email=${encodeURIComponent(userEmail)}&experience=${encodeURIComponent(userExperience)}&score=${score}&total=${totalQuestions}&level=${encodeURIComponent(levelName)}&session=${encodeURIComponent(currentSessionId)}`;
                    window.location.href = targetUrl;
                };
                actionContainer.innerHTML = '';
                actionContainer.appendChild(nextBtn);

            } catch (err) {
                console.error('Error saving quiz result:', err.message || err);
                resultDiv.textContent = `เกิดข้อผิดพลาดในการบันทึกผล (ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต) กรุณาลองใหม่`;
                resultDiv.style.backgroundColor = '#ffd1d1';
                resultDiv.style.color = '#900';
                resultDiv.style.display = 'block';
                
                submitBtn.disabled = false;
                submitBtn.textContent = 'ส่งคำตอบ';
            }
        });
    </script>
</body>
</html>
