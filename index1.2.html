        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function renderQuestions() {
            const area = document.getElementById('questionArea');
            let html = `<h3 class="text-center text-secondary mb-4">${escapeHtml(PART_NAME)}</h3>`;

            scripts.forEach(script => {
                const id = script.id;
                html += `
                <div class="question-item">
                    <div class="question-title">
                        <i class="fas fa-comment-dots text-danger me-2"></i>${id}. ลูกค้าโต้แย้ง: “${escapeHtml(script.q)}”
                    </div>
                    <div class="d-flex align-items-center flex-wrap mb-2">
                        <button class="play-audio-btn" onclick="playAudio(${id})">
                            <i class="fas fa-volume-up"></i> ฟังเสียงตัวอย่าง
                        </button>
                        <button class="btn btn-outline-secondary btn-sm" onclick="toggleAnswer(${id})">
                            <i class="fas fa-eye"></i> ดู/ซ้อมคำตอบ
                        </button>
                    </div>
                    <div id="answer-${id}" class="answer-area">
                        <div class="answer-text"><strong>คำตอบพนักงาน:</strong>\n${escapeHtml(script.a)}</div>
                        <div class="audio-container">
                            <audio id="audio-${id}" controls preload="none" class="w-100" playsinline src="${script.audioUrl}">
                                เบราว์เซอร์ของคุณไม่รองรับการเล่นไฟล์เสียง
                            </audio>
                        </div>
                    </div>
                </div>`;
            });
            area.innerHTML = html;

            // เล่นทีละไฟล์: เมื่อไฟล์ใดเริ่มเล่น ให้หยุดไฟล์อื่น
            area.querySelectorAll('audio').forEach(a => {
                a.addEventListener('play', () => {
                    area.querySelectorAll('audio').forEach(o => { if (o !== a) o.pause(); });
                });
            });
        }

        function toggleAnswer(id) {
            const div = document.getElementById(`answer-${id}`);
            const isVisible = div.style.display === 'block';
            div.style.display = isVisible ? 'none' : 'block';
            if (isVisible) stopAudio(id);
        }

        function playAudio(id) {
            const div = document.getElementById(`answer-${id}`);
            const player = document.getElementById(`audio-${id}`);
            div.style.display = 'block';
            player.play().catch(e => alert("ไม่สามารถเล่นไฟล์เสียงได้: " + e.message));
        }

        function stopAudio(id) {
            const player = document.getElementById(`audio-${id}`);
            if (player) { player.pause(); player.currentTime = 0; }
        }

        document.addEventListener('DOMContentLoaded', renderQuestions);
    </script>
