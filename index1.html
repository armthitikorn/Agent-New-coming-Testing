        // รายการหัวข้อทั้งหมด (ลำดับปุ่มเรียงตามนี้)
        // หัวข้อที่มี subs = มีปุ่มย่อย ให้ใส่ items ในแต่ละปุ่มย่อยแทน
        const topics = [
            { key: 'lead', label: 'การโทรนัดหมาย', sub: 'ขอเข้าพบ', title: PART_NAME, items: scripts },
            { key: 'product', label: 'ผลิตภัณฑ์', sub: 'เลือกผลิตภัณฑ์ 4 ตัว', subs: [
                { key: 'whole', label: 'PRUWhow life 99/20', items: wlScripts },
                { key: 'add',   label: 'สัญญาเพิ่มเติม ADD RCC (ADD)OD2', items: addScripts },
                { key: 'cm',    label: 'Multi_CI (CM)', items: cmScripts },
                { key: 'care',  label: 'PRUBestter Care : HAL,HAP', items: careScripts }
            ] },
            { key: 'close', label: 'ปิดการขาย', sub: 'ตอบข้อโต้แย้งตอนปิดการขาย', title: 'ปิดการขาย', items: closeScripts }
        ];
        let current = 0, curSub = 0;

        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // หัวข้อที่กำลังแสดง (ถ้ามีปุ่มย่อยจะเป็นปุ่มย่อยที่เลือกอยู่)
        function activeNode() {
            const t = topics[current];
            return t.subs ? t.subs[curSub] : t;
        }

        function renderNav() {
            const nav = document.getElementById('topicNav');
            nav.innerHTML = topics.map((t, i) => `
                <button type="button" class="topic-btn${i === current ? ' active' : ''}" role="tab"
                        aria-selected="${i === current}" onclick="selectTopic(${i})">
                    ${escapeHtml(t.label)}<small>${escapeHtml(t.sub)}</small>
                </button>`).join('');
        }

        function renderSubNav() {
            const box = document.getElementById('subNav');
            const t = topics[current];
            if (!t.subs) { box.innerHTML = ''; box.style.display = 'none'; return; }
            box.style.display = 'grid';
            box.innerHTML = t.subs.map((s, i) => `
                <button type="button" class="sub-btn${i === curSub ? ' active' : ''}"
                        onclick="selectSub(${i})">${escapeHtml(s.label)}</button>`).join('');
        }

        function stopAllAudio() { document.querySelectorAll('audio').forEach(a => a.pause()); }

        function selectTopic(i) {
            stopAllAudio();
            current = i; curSub = 0;
            renderNav(); renderSubNav(); renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectSub(i) {
            stopAllAudio();
            curSub = i;
            renderSubNav(); renderQuestions();
        }

        function renderQuestions() {
            const area = document.getElementById('questionArea');
            const topic = activeNode();
            let html = `<h3 class="text-center text-secondary mb-4">${escapeHtml(topic.title || topic.label)}</h3>`;

            if (!topic.items.length) {
                html += `<div class="coming"><i class="fas fa-hourglass-half fa-2x mb-3"></i><div>กำลังเตรียมเนื้อหาหัวข้อนี้ โปรดรอสักครู่</div></div>`;
                area.innerHTML = html;
                return;
            }

            topic.items.forEach(script => {
                const id = script.id;
                html += `
                <div class="question-item">
                    <div class="question-title">
                        <i class="fas fa-comment-dots text-danger me-2"></i>${id}. ลูกค้าโต้แย้ง: “${escapeHtml(script.q)}”
                    </div>
                    <div class="d-flex align-items-center flex-wrap mb-2">
                        <button class="play-audio-btn" onclick="playAudio(${id})">
                            <i class="fas fa-volume-up"></i> ฟังเสียงตัวอย่าง
                        </button>
                        <button class="btn btn-outline-secondary btn-sm" onclick="toggleAnswer(${id})">
                            <i class="fas fa-eye"></i> ดู/ซ้อมคำตอบ
                        </button>
                    </div>
                    <div id="answer-${id}" class="answer-area">
                        <div class="answer-text"><strong>คำตอบพนักงาน:</strong>\n${escapeHtml(script.a)}</div>
                        <div class="audio-container">
                            <audio id="audio-${id}" controls preload="none" class="w-100" playsinline src="${escapeHtml(script.audioUrl)}">
                                เบราว์เซอร์ของคุณไม่รองรับการเล่นไฟล์เสียง
                            </audio>
                        </div>
                    </div>
                </div>`;
            });
            area.innerHTML = html;

            // เล่นทีละไฟล์: เมื่อไฟล์ใดเริ่มเล่น ให้หยุดไฟล์อื่น
            area.querySelectorAll('audio').forEach(a => {
                a.addEventListener('play', () => {
                    area.querySelectorAll('audio').forEach(o => { if (o !== a) o.pause(); });
                });
            });
        }

        function toggleAnswer(id) {
            const div = document.getElementById(`answer-${id}`);
            const isVisible = div.style.display === 'block';
            div.style.display = isVisible ? 'none' : 'block';
            if (isVisible) stopAudio(id);
        }

        function playAudio(id) {
            const div = document.getElementById(`answer-${id}`);
            const player = document.getElementById(`audio-${id}`);
            div.style.display = 'block';
            player.play().catch(e => alert("ไม่สามารถเล่นไฟล์เสียงได้: " + e.message));
        }

        function stopAudio(id) {
            const player = document.getElementById(`audio-${id}`);
            if (player) { player.pause(); player.currentTime = 0; }
        }

        document.addEventListener('DOMContentLoaded', () => { renderNav(); renderSubNav(); renderQuestions(); });
    </script>
